plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android';
    id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'dev.pocketprint.station'
    compileSdk 36
    defaultConfig { applicationId 'dev.pocketprint.station'; minSdk 26; targetSdk 36; versionCode 1;
        versionName '1.0' }
    buildFeatures { aidl true; compose true }
    sourceSets { main { java.srcDirs += "$rootDir/ui/src/main/kotlin"; aidl.srcDirs += "$rootDir/contract/src/main/aidl" } }
    kotlinOptions { jvmTarget = '17' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17;
        targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
